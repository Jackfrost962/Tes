name: Crypto Signal Scanner

on:
  workflow_dispatch: # Manual trigger only

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tabulate

      - name: 🔍 Run crypto scanner
        run: python daily_radar.py

      - name: 📤 Read signal output
        id: signal
        run: |
          if [ -f MARKET_REPORT.md ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "message<<EOF" >> $GITHUB_OUTPUT
            cat MARKET_REPORT.md | tail -c 4000 >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: 📱 Send Telegram Alert
        if: steps.signal.outputs.found == 'true'
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            📊 **DAILY QUANT REGIME & LIQUIDITY MATRIX** 📊
